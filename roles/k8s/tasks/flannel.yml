##. 生成flannel
- name: cp flannel.yaml.j2
  when: inventory_hostname in groups['master0']
  template:
    src: "flannel.yaml.j2"
    dest: "/home/flannel.yaml"

##. 生成harbor pull image policy
- name: apply flannel
  when: inventory_hostname in groups['master0']
  command: "kubectl apply -f /home/flannel.yaml"

- name: Extract CNI plugins to /opt/cni/bin
  unarchive:
    src: cni-plugins-linux-amd64-v1.5.1.tgz
    dest: /opt/cni/bin/
    remote_src: yes
    creates: /opt/cni/bin/
  when: inventory_hostname in groups['k8s']


